name: Native regression tests

on:
  push:
    branches: [master]
    paths:
      - 'src/Encoding.cpp'
      - 'src/Encoding.h'
      - 'src/uchardet/EncodingDetection.cpp'
      - 'test/test_files/encoding/TestEncodingDetection.*'
      - 'test/test_files/encoding/UTF-16/*.txt'
      - '.github/workflows/native-tests.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/Encoding.cpp'
      - 'src/Encoding.h'
      - 'src/uchardet/EncodingDetection.cpp'
      - 'test/test_files/encoding/TestEncodingDetection.*'
      - 'test/test_files/encoding/UTF-16/*.txt'
      - '.github/workflows/native-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Encoding regression
        shell: pwsh
        run: pwsh -NoProfile -File test\test_files\encoding\TestEncodingDetection.ps1
